name: Playwright Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout repository code
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 3. Install dependencies
      run: npm ci

    - name: 4. Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: 5. Run All Playwright Tests
      run: npx playwright test

    - name: 6. Upload HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-execution-report
        path: playwright-report/
        retention-days: 30

    - name: Run Playwright tests
      run: npx playwright test --grep-invert "@visual"